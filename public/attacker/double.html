<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多层嵌套实验</title>
<style>
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#24292f; color:#e6edf3; font-size:13px; }
  .notice { background:#9a6700; color:#fff; padding:8px 16px; }
  .wrap { padding:16px; }
  .outer { border:3px solid #f85149; border-radius:10px; padding:12px; max-width:900px; margin:0 auto; }
  .outer h2 { margin:0 0 8px; font-size:15px; color:#ff9492; }
  iframe { width:100%; height:640px; border:0; background:#fff; border-radius:6px; }
  .tip { max-width:900px; margin:12px auto 0; color:#8b949e; line-height:1.8; }
  code { background:#000; padding:1px 5px; border-radius:4px; color:#79c0ff; }
  a { color:#56d4dd; }
</style>
</head>
<body>
<div class="notice">实验 3：多层嵌套（攻击者页 → 9001 内层壳 → 8080 受保护页）。<code>frame-ancestors</code> 要求<b>整个祖先链</b>都被允许。</div>
<div class="wrap">
  <div class="outer">
    <h2>攻击者窗口 :9001（本页）</h2>
    <iframe title="inner-shell" src="/inner-shell.html"></iframe>
  </div>
  <p class="tip">
    内层壳同样来自 :9001，再由它嵌入 :8080/protected。祖先链中出现了未授权来源，
    因此即使“直接父窗口看起来无害”，<code>frame-ancestors</code> 仍会拦截（它校验全部祖先，不只是 parent）。<br>
    对比实验：去 <a href="http://localhost:9002/" target="_blank" rel="noopener">可信合作方 :9002</a>，
    该来源在白名单内，单层嵌套可以正常加载。
  </p>
</div>
</body>
</html>
